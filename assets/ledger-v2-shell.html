<!doctype html>
<html lang="zh-CN" data-schema-version="2" data-comments-enabled="true" data-task-id="__TASK_ID__" data-ledger-version="__LEDGER_VERSION__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>__TITLE__ · 开发生命周期</title>
  <style>
    :root{--bg:#f4f6f9;--panel:#fff;--ink:#172033;--muted:#667085;--line:#dfe4ec;--blue:#1769aa;--blue-soft:#eaf3fb;--green:#157347;--green-soft:#e8f6ee;--amber:#9a6700;--amber-soft:#fff4d6;--red:#b42318;--red-soft:#feeceb;--shadow:0 8px 28px rgba(22,36,58,.08);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);line-height:1.55}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--blue)}code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.hidden{display:none!important}
    .top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .top-inner{max-width:1440px;margin:auto;padding:13px 20px;display:flex;align-items:center;gap:16px}.identity{min-width:0;flex:1}.eyebrow{font-size:12px;color:var(--blue);font-weight:750;letter-spacing:.04em}.identity h1{font-size:20px;line-height:1.2;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--muted)}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;color:var(--ink)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.small{font-size:12px;padding:5px 8px}
    .shell{max-width:1440px;margin:auto;padding:18px 20px 48px}.status-grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;margin-bottom:14px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}.metric small{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;margin-top:3px;font-size:15px;overflow-wrap:anywhere}
    .alert{border:1px solid #efcc7a;background:var(--amber-soft);border-radius:12px;padding:12px 14px;margin:12px 0}.alert.ok{border-color:#a8d9ba;background:var(--green-soft)}.alert h2{font-size:14px;margin:0 0 5px}.alert ul{margin:5px 0 0;padding-left:20px}.next{display:flex;align-items:flex-start;gap:10px}.next b{color:var(--blue);white-space:nowrap}
    .tabs{display:flex;gap:7px;overflow:auto;padding:4px 0 12px;scrollbar-width:thin}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;white-space:nowrap}.tab[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
    .panel{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px}.main,.side{min-width:0}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:12px}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}.card-head h2,.card-head h3{margin:0;font-size:16px}.card-body{padding:14px 16px}.card p{margin:6px 0}.muted{color:var(--muted)}
    details.group{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;box-shadow:var(--shadow)}details.group>summary{display:flex;align-items:center;gap:10px;list-style:none;padding:14px 16px;font-weight:750}details.group>summary::-webkit-details-marker{display:none}details.group>summary:before{content:"›";font-size:22px;line-height:1;transition:transform .15s}details.group[open]>summary:before{transform:rotate(90deg)}.group-content{padding:0 12px 12px}
    [id]{scroll-margin-top:92px}.artifact{border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}.artifact-top{display:flex;gap:10px;align-items:flex-start}.artifact-top h3{margin:0;flex:1;font-size:14px}.artifact-details{margin-top:8px}.artifact-details pre{white-space:pre-wrap;background:#f7f8fa;border-radius:8px;padding:10px;overflow:auto}.evidence{font-size:12px;color:var(--muted);margin-top:8px}.evidence ul{margin:4px 0;padding-left:18px}.focus-flash{animation:focusFlash 1.4s ease}@keyframes focusFlash{0%,45%{box-shadow:0 0 0 4px rgba(23,105,170,.28)}100%{box-shadow:none}}
    .pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:750;background:#edf0f5;color:#475467}.pill.complete,.pill.done,.pill.pass{background:var(--green-soft);color:var(--green)}.pill.pending,.pill.planned{background:var(--amber-soft);color:var(--amber)}.pill.failed,.pill.blocked{background:var(--red-soft);color:var(--red)}.pill.strict{background:#efe9ff;color:#6941c6}.pill.standard{background:var(--blue-soft);color:var(--blue)}
    .list{margin:4px 0;padding-left:20px}.kv{display:grid;grid-template-columns:145px minmax(0,1fr);gap:6px 12px;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px;margin-top:8px}table{border-collapse:collapse;width:100%;min-width:620px;font-size:12px}th,td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:8px}th{background:#f7f8fa;position:sticky;top:0}tr:last-child td{border-bottom:0}
    .diagram{display:flex;align-items:stretch;gap:8px;overflow:auto;padding:8px 0}.diagram.wrap{flex-wrap:wrap}.node{min-width:150px;border:1px solid #aac7e0;background:var(--blue-soft);border-radius:9px;padding:9px}.node small{display:block;color:var(--muted);margin-top:3px}.edge{display:flex;align-items:center;color:var(--muted);white-space:nowrap}.sequence{display:grid;gap:7px}.lane{display:grid;grid-template-columns:minmax(110px,180px) minmax(0,1fr);gap:8px;align-items:start}.lane>b{padding:8px;background:#f0f3f7;border-radius:8px}.lane-steps{display:flex;gap:7px;overflow:auto}.state-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.state-node{border:1px solid #aac7e0;background:var(--blue-soft);border-radius:9px;padding:9px}.stepper{counter-reset:step;display:grid;gap:8px}.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:9px}.step:before{counter-increment:step;content:counter(step);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700}.erd{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.entity{border:1px solid var(--line);border-radius:9px;overflow:hidden}.entity b{display:block;padding:8px;background:#eef4fa}.entity ul{margin:0;padding:8px 8px 8px 25px;font-size:12px}
    .side .card{position:sticky;top:86px}.toc a{display:block;text-decoration:none;padding:5px 0;font-size:13px}.toc a:hover{text-decoration:underline}.phase-line{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.phase-line:last-child{border-bottom:0}.shell.compact .panel{grid-template-columns:1fr}.shell.compact .side{display:none}.shell.compact details.group>summary{padding:11px 14px}.change-list{display:grid;gap:7px}.change-item{border-left:3px solid #b7c8da;padding:6px 9px;background:#fafbfd}
    .timeline-controls{display:flex;gap:8px;margin-bottom:8px}.timeline-item{border-left:3px solid #b7c8da;padding:7px 10px;margin:6px 0}.timeline-item b{font-size:12px}.timeline-item small{display:block;color:var(--muted)}
    .comments-drawer{position:fixed;right:0;top:0;bottom:0;width:min(440px,94vw);z-index:40;background:#fff;border-left:1px solid var(--line);box-shadow:-12px 0 34px rgba(22,36,58,.16);display:flex;flex-direction:column}.drawer-head{padding:14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}.drawer-head h2{margin:0;flex:1;font-size:17px}.comments-list{padding:12px;overflow:auto;flex:1}.thread{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:9px}.thread p{white-space:pre-wrap}.composer{position:fixed;inset:0;z-index:50;background:rgba(20,30,45,.45);display:grid;place-items:center;padding:16px}.dialog{width:min(560px,100%);background:#fff;border-radius:13px;padding:16px}.dialog textarea{width:100%;min-height:110px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.comment-target{outline:2px solid #f0b429;outline-offset:2px}.selection-action{position:fixed;left:18px;bottom:18px;z-index:35;box-shadow:var(--shadow)}
    #print-root{display:none}
    @media(max-width:900px){.status-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{grid-template-columns:1fr}.side .card{position:static}.top-inner{align-items:flex-start}.toolbar{justify-content:flex-end}.metric:last-child{grid-column:1/-1}}
    @media(max-width:560px){.shell{padding:12px 10px 36px}.top-inner{padding:10px;display:grid;grid-template-columns:minmax(0,1fr) auto}.toolbar .optional{display:none}.status-grid{grid-template-columns:1fr 1fr}.card-head,.card-body{padding:12px}.kv{grid-template-columns:1fr}.kv dd{margin-bottom:5px}}
    @media print{.top,.tabs,.side,.no-print,.comments-drawer,.composer{display:none!important}.shell{max-width:none;padding:0}.status-grid{grid-template-columns:repeat(4,1fr)}#interactive-root{display:none}#print-root{display:block}.card,details.group{box-shadow:none}details.group{break-inside:auto}details.group>summary:before{display:none}.artifact,.diagram,.erd{break-inside:avoid}table{break-inside:auto}tr{break-inside:avoid}}
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="identity"><span class="eyebrow" id="task-id"></span><h1 id="task-title"></h1><div class="meta" id="task-meta"></div></div>
      <div class="toolbar"><button class="btn optional" id="copy-task">复制任务 ID</button><button class="btn optional" id="print-button">打印</button><button class="btn primary" id="comments-button">评论 <span id="comments-count">0</span></button></div>
    </div>
  </header>
  <main class="shell">
    <section class="status-grid" id="status-grid"></section>
    <section id="blockers"></section>
    <nav class="tabs" id="tabs" role="tablist" aria-label="任务视图"></nav>
    <div id="interactive-root"></div>
    <div id="print-root"></div>
  </main>
  <button class="btn primary selection-action hidden no-print" id="comment-selection-action">评论所选</button>

  <aside class="comments-drawer hidden" id="comments-drawer" aria-label="台账评论">
    <div class="drawer-head"><h2>评论</h2><select id="comments-filter"><option value="open">未解决</option><option value="all">全部</option><option value="resolved">已解决</option></select><button class="btn small" id="comments-copy">复制</button><button class="btn small" id="comments-export">导出</button><button class="btn small" id="comments-close">关闭</button></div>
    <div class="comments-list" id="comments-list"></div>
  </aside>
  <div class="composer hidden" id="comment-composer">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="comment-title"><h2 id="comment-title">添加评论</h2><p class="muted" id="comment-target-preview"></p><select id="comment-severity"><option value="question">问题</option><option value="suggestion">建议</option><option value="blocker">阻塞</option></select><textarea id="comment-textarea" placeholder="写下需要解释、修改或阻塞的内容"></textarea><div class="dialog-actions"><button class="btn" id="comment-cancel">取消</button><button class="btn primary" id="comment-save">保存</button></div></div>
  </div>

  <script id="ledger-comment-bridge-config">globalThis.__LEDGER_COMMENT_BRIDGE__=null;</script>
  <script id="ledger-data" type="application/json">__LEDGER_DATA__</script>
  <script id="ledger-comments-data" type="application/json">__LEDGER_COMMENTS__</script>
  <script>
  (()=>{
    'use strict';
    const snapshot=JSON.parse(document.getElementById('ledger-data').textContent);
    const task=snapshot.task,phases=snapshot.phases,events=snapshot.events||[];
    const labels=snapshot.artifactLabels||{},suffixes=snapshot.artifactSuffixes||{};
    const groups=[
      ['需求与决策',['functionalBreakdown']],
      ['系统方案',['applicationArchitecture','codeArchitecture','uiDesign']],
      ['流程与状态',['stateMachine','mainFlow','recoveryFlow']],
      ['数据与领域',['dataArchitecture','domainModel','persistenceModel','dataInventory']],
      ['研发影响',['impact']],
      ['发布与验证',['release','validation','traceability']],
      ['证据与历史',[]]
    ];
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const kebab=value=>String(value).replace(/([a-z])([A-Z])/g,'$1-$2').toLowerCase();
    const statusClass=value=>String(value||'pending').toLowerCase().replace(/[^a-z-]/g,'');
    const list=value=>Array.isArray(value)?value:[];
    const valueText=value=>typeof value==='string'?value:(value&&typeof value==='object'?(value.label||value.summary||value.path||value.url||JSON.stringify(value)):String(value??''));
    const evidenceHtml=items=>list(items).length?`<div class="evidence"><b>证据</b><ul>${list(items).map(item=>`<li>${esc(valueText(item))}</li>`).join('')}</ul></div>`:'';
    const compactCore=new Set(['functionalBreakdown','codeArchitecture','impact','validation','traceability']);
    const visibleArtifactKeys=(phase,keys)=>keys.filter(key=>{const status=phase.artifacts?.[key]?.status;if(snapshot.render?.effective==='COMPACT')return compactCore.has(key)||(status&&status!=='pending');return list(snapshot.requiredArtifacts?.[phase.id]).includes(key)||(status&&status!=='pending')});
    const tableHtml=item=>{const headers=list(item.headers),rows=list(item.rows);if(!headers.length||!rows.length)return '';const values=row=>Array.isArray(row)?row:headers.map(header=>row?.[header]??'');return `<div class="table-wrap"><table><thead><tr>${headers.map(header=>`<th>${esc(valueText(header))}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${values(row).map(value=>`<td>${esc(valueText(value))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`};
    const flowHtml=item=>{const nodes=list(item.nodes).map(node=>`<div class="node"><b>${esc(node.label||node.id)}</b>${node.detail?`<small>${esc(node.detail)}</small>`:''}</div>`);return `<div class="diagram ${item.wrap?'wrap':''}">${nodes.map((node,index)=>node+(index<nodes.length-1?`<div class="edge">→ ${esc(list(item.edges)[index]?.label||'')}</div>`:'')).join('')}</div>`};
    const detailHtml=details=>list(details).map(item=>{
      if(typeof item==='string')return `<p>${esc(item)}</p>`;
      if(!item||typeof item!=='object')return '';
      if(['diagram','dependencyGraph','branchGraph','recoveryFlow'].includes(item.type))return flowHtml(item);
      if(item.type==='sequence')return `<div class="sequence">${list(item.lanes).map(lane=>`<div class="lane"><b>${esc(lane.label||lane.id)}</b><div class="lane-steps">${list(lane.steps).map(step=>`<div class="node"><b>${esc(step.label||valueText(step))}</b>${step.detail?`<small>${esc(step.detail)}</small>`:''}</div>`).join('')}</div></div>`).join('')}</div>`;
      if(item.type==='stateMachine')return `<div class="state-grid">${list(item.states).map(state=>`<div class="state-node"><b>${esc(state.label||state.id)}</b>${state.on?`<small>${esc(valueText(state.on))}</small>`:''}${state.detail?`<p>${esc(state.detail)}</p>`:''}</div>`).join('')}</div>${list(item.transitions).length?`<p class="muted">${list(item.transitions).map(valueText).map(esc).join(' · ')}</p>`:''}`;
      if(item.type==='releaseStepper')return `<div class="stepper">${list(item.steps).map(step=>`<div class="step"><div><b>${esc(step.label||valueText(step))}</b>${step.detail?`<p>${esc(step.detail)}</p>`:''}</div></div>`).join('')}</div>`;
      if(item.type==='timeline')return `<div>${list(item.items).map(entry=>`<div class="timeline-item"><b>${esc(entry.label||entry.type||'event')}</b> ${esc(entry.summary||'')}<small>${esc(entry.at||'')}</small></div>`).join('')}</div>`;
      if(item.type==='table')return tableHtml(item);
      if(item.type==='matrix'){const rows=list(item.rows),affected=rows.filter(row=>!['不受影响','N/A','not-applicable'].includes(String(row?.status||row?.判定||''))),unaffected=rows.length-affected.length;return `${unaffected?`<p class="muted">${unaffected} 项不受影响，默认收起；优先展示受影响、待确认和高风险项。</p>`:''}${tableHtml({...item,rows:affected.length?affected:rows})}`;}
      if(item.type==='erd'){
        return `<div class="erd">${list(item.entities).map(entity=>`<div class="entity"><b>${esc(entity.name)}</b><ul>${list(entity.fields).map(field=>`<li>${esc(valueText(field))}</li>`).join('')}</ul></div>`).join('')}</div>${list(item.relationships).length?`<div class="evidence"><b>关系</b><ul>${list(item.relationships).map(valueText).map(value=>`<li>${esc(value)}</li>`).join('')}</ul></div>`:''}`;
      }
      const entries=Object.entries(item).filter(([key])=>key!=='type');
      return `<dl class="kv">${entries.map(([key,value])=>`<dt>${esc(key)}</dt><dd>${esc(Array.isArray(value)?value.map(valueText).join('；'):valueText(value))}</dd>`).join('')}</dl>`;
    }).join('');
    const artifactHtml=(phase,key)=>{
      const artifact=phase.artifacts?.[key]||{status:'pending',summary:'',evidence:[]};
      const suffix=suffixes[key]||kebab(key),id=`phase-${phase.id}-${suffix}`;
      return `<article class="artifact" id="${esc(id)}" data-commentable data-artifact="${esc(key)}"><div class="artifact-top"><h3>${esc(labels[key]||key)}</h3><span class="pill ${statusClass(artifact.status)}">${esc(artifact.status||'pending')}</span><button class="btn small no-print" data-comment-target="${esc(id)}" data-comment-label="${esc(labels[key]||key)}">评论</button></div>${artifact.summary?`<p>${esc(artifact.summary)}</p>`:'<p class="muted">待补充</p>'}<div class="artifact-details">${detailHtml(artifact.details)}</div>${evidenceHtml(artifact.evidence)}</article>`;
    };
    const requirementsHtml=phase=>{
      const scope=phase.scope||{};
      return `<section class="card" id="phase-${esc(phase.id)}-requirements" data-commentable><div class="card-head"><h2>需求与范围</h2><button class="btn small no-print" data-comment-target="phase-${esc(phase.id)}-requirements" data-comment-label="需求与范围">评论</button></div><div class="card-body"><p><b>现状：</b>${esc(scope.currentBehavior||'待确认')}</p><div class="kv"><dt>目标</dt><dd>${esc(list(scope.goals).join('；')||'待确认')}</dd><dt>非目标</dt><dd>${esc(list(scope.nonGoals).join('；')||'未声明')}</dd><dt>假设</dt><dd>${esc(list(scope.assumptions).map(valueText).join('；')||'无')}</dd></div>${evidenceHtml(scope.evidence)}${requirementsTable(phase.requirements)}</div></section>`;
    };
    const requirementsTable=items=>!list(items).length?'':`<div class="table-wrap"><table><thead><tr><th>REQ</th><th>需求</th><th>验收</th><th>状态</th></tr></thead><tbody>${list(items).map(item=>`<tr><td>${esc(item.id)}</td><td>${esc(item.statement)}</td><td>${esc(list(item.acceptance).map(valueText).join('；'))}</td><td><span class="pill ${statusClass(item.status)}">${esc(item.status||'proposed')}</span></td></tr>`).join('')}</tbody></table></div>`;
    const branchHtml=phase=>{const branch=phase.branch||{};return `<section class="artifact" id="phase-${esc(phase.id)}-branch" data-commentable><div class="artifact-top"><h3>分支与基线</h3><span class="pill ${statusClass(branch.syncStatus)}">${esc(branch.syncStatus||'PLANNED')}</span><button class="btn small no-print" data-comment-target="phase-${esc(phase.id)}-branch" data-comment-label="分支与基线">评论</button></div><dl class="kv"><dt>branch</dt><dd>${esc(branch.name||'待确认')}</dd><dt>parent</dt><dd>${esc(phase.parentPhaseId||'NONE')} ${esc(branch.parentCandidateSha||'')}</dd><dt>base</dt><dd>${esc(branch.baseSha||'待确认')}</dd><dt>head / candidate</dt><dd>${esc(branch.headSha||'待确认')} / ${esc(branch.candidateSha||'待确认')}</dd></dl></section>`};
    const validationTables=phase=>{
      const tests=list(phase.tests),issues=list(phase.issues),releases=list(phase.releases);
      return `${tests.length?`<div class="table-wrap"><table><thead><tr><th>用例</th><th>预期</th><th>实际</th><th>状态</th><th>证据</th></tr></thead><tbody>${tests.map(item=>`<tr><td>${esc(item.id)}</td><td>${esc(item.expected)}</td><td>${esc(item.actual||'待执行')}</td><td>${esc(item.status||'PLANNED')}</td><td>${esc(list(item.evidence).map(valueText).join('；'))}</td></tr>`).join('')}</tbody></table></div>`:''}${releases.length?`<p><b>发布记录：</b>${esc(releases.map(valueText).join('；'))}</p>`:''}${issues.length?`<p><b>问题：</b>${esc(issues.map(valueText).join('；'))}</p>`:''}`;
    };
    const historyHtml=phase=>{const selected=events.filter(event=>!event.phaseId||event.phaseId===phase.id);return `<section class="artifact" id="phase-${esc(phase.id)}-history"><h3>最近事件</h3>${selected.slice(-30).reverse().map(event=>`<div class="timeline-item"><b>${esc(event.type)}</b> ${esc(event.summary)}<small>${esc(event.at)}</small></div>`).join('')||'<p class="muted">暂无事件</p>'}</section>`};
    const groupHtml=(phase,name,keys)=>{
      const visibleKeys=visibleArtifactKeys(phase,keys);
      let body='';
      if(name==='需求与决策')body=requirementsHtml(phase)+visibleKeys.map(key=>artifactHtml(phase,key)).join('');
      else if(name==='研发影响')body=visibleKeys.map(key=>artifactHtml(phase,key)).join('')+branchHtml(phase);
      else if(name==='发布与验证')body=visibleKeys.map(key=>artifactHtml(phase,key)).join('')+validationTables(phase);
      else if(name==='证据与历史')body=historyHtml(phase);
      else body=visibleKeys.map(key=>artifactHtml(phase,key)).join('');
      const open=name==='需求与决策'||list(phase.scope?.blockingDecisions).length>0?' open':'';
      return `<details class="group"${open}><summary>${esc(name)} <span class="muted">${visibleKeys.length?`${visibleKeys.length} 项`:''}</span></summary><div class="group-content">${body}</div></details>`;
    };
    const groupVisible=(phase,name,keys)=>{const visible=visibleArtifactKeys(phase,keys);if(name==='需求与决策'||name==='研发影响')return true;if(name==='发布与验证')return visible.length||list(phase.tests).length||list(phase.releases).length||list(phase.issues).length;if(name==='证据与历史')return snapshot.render?.effective!=='COMPACT'&&events.length;return visible.length};
    const phaseToc=phase=>{
      const links=[['requirements','需求与范围'],...visibleArtifactKeys(phase,Object.keys(phase.artifacts||{})).map(key=>[suffixes[key]||kebab(key),labels[key]||key]),['branch','分支与基线'],...(snapshot.render?.effective==='COMPACT'?[]:[['history','最近事件']])];
      return `<div class="card"><div class="card-head"><h3>本 Phase 目录</h3></div><div class="card-body toc">${links.map(([suffix,label])=>`<a href="#phase-${esc(phase.id)}-${esc(suffix)}">${esc(label)}</a>`).join('')}</div></div>`;
    };
    const phasePanel=phase=>{const phaseHead=snapshot.render?.effective==='COMPACT'?'':`<div class="card"><div class="card-head"><div><span class="eyebrow">${esc(phase.id)} · ${esc(phase.name)}</span><h2>${esc(phase.state)}</h2></div><span class="pill ${statusClass(phase.state)}">${esc(phase.state)}</span></div><div class="card-body next"><b>下一步</b><span>${esc(snapshot.resume?.recommendedPhase===phase.id?snapshot.resume.nextAction:(phase.nextAction||task.nextAction||'待确认'))}</span></div></div>`;return `<div class="panel"><section class="main">${phaseHead}${groups.filter(group=>groupVisible(phase,group[0],group[1])).map(group=>groupHtml(phase,group[0],group[1])).join('')}</section><aside class="side">${phaseToc(phase)}</aside></div>`};
    const overviewPanel=()=>{
      const lines=Object.values(phases).map(phase=>`<div class="phase-line"><b>${esc(phase.id)}</b><span>${esc(phase.name)}</span><span class="pill ${statusClass(phase.state)}">${esc(phase.state)}</span></div>`).join('');
      const lineage=Object.values(phases).map(phase=>`<tr><td>${esc(phase.id)}</td><td>${esc(phase.parentPhaseId)}</td><td>${esc(phase.branch?.name||'待确认')}</td><td>${esc(phase.branch?.baseSha||'待确认')}</td><td>${esc(phase.branch?.candidateSha||'待确认')}</td><td>${esc(phase.branch?.syncStatus||'PLANNED')}</td></tr>`).join('');
      const branchFlow=flowHtml({type:'branchGraph',nodes:Object.values(phases).map(phase=>({id:phase.id,label:`${phase.id} ${phase.name}`,detail:phase.branch?.candidateSha||phase.state})),edges:Object.values(phases).slice(1).map(phase=>({label:phase.branch?.syncStatus||''}))});
      const changes=list(snapshot.recentChanges).slice().reverse().slice(0,8).map(event=>`<div class="change-item"><b>${esc(event.type)}</b> ${esc(event.summary)}<small class="muted"> · ${esc(event.at)}</small></div>`).join('');
      const lineageCard=snapshot.render?.effective==='COMPACT'?'':`<div class="card"><div class="card-head"><h2>分支谱系</h2></div><div class="card-body">${branchFlow}<div class="table-wrap"><table><thead><tr><th>Phase</th><th>父 Phase</th><th>分支</th><th>Base</th><th>Candidate</th><th>同步</th></tr></thead><tbody>${lineage}</tbody></table></div></div></div>`;
      const changesCard=snapshot.render?.effective==='DEEP'&&changes?`<div class="card"><div class="card-head"><h2>本轮变化</h2><span class="pill">最近 ${Math.min(8,list(snapshot.recentChanges).length)} 条</span></div><div class="card-body change-list">${changes}</div></div>`:'';
      return `<div class="panel"><section class="main"><div class="card"><div class="card-head"><h2>Phase 状态</h2><span class="pill ${statusClass(snapshot.render?.effective)}">${esc(snapshot.render?.effective||'COMPACT')}</span></div><div class="card-body">${lines}</div></div>${lineageCard}${changesCard}</section><aside class="side"><div class="card"><div class="card-head"><h3>当前阅读重点</h3></div><div class="card-body"><p><b>${esc(snapshot.resume?.recommendedPhase||task.activePhase)}</b> · ${esc(snapshot.resume?.firstBlockingGate||'完成')}</p><p>${esc(snapshot.resume?.nextAction||task.nextAction||'继续当前 Phase')}</p></div></div></aside></div>`;
    };
    const integrationPanel=()=>{const integration=task.integration||{},phaseNodes=Object.values(phases).map(phase=>({id:phase.id,label:`${phase.id} ${phase.name}`,detail:phase.branch?.candidateSha||phase.state}));const dependency=flowHtml({type:'dependencyGraph',nodes:phaseNodes,edges:list(integration.dependencies).map(item=>({label:valueText(item)}))});const table=(title,items)=>list(items).length?`<div class="card"><div class="card-head"><h2>${esc(title)}</h2></div><div class="card-body">${detailHtml(items)}</div></div>`:'';return `<div class="panel"><section class="main"><div class="card"><div class="card-head"><h2>跨阶段依赖</h2></div><div class="card-body">${dependency}</div></div>${table('共享接口、数据与资源',integration.sharedResources)}${table('发布顺序与回滚',integration.releasePlan)}${list(integration.tests).length?`<div class="card"><div class="card-head"><h2>跨阶段验证</h2></div><div class="card-body">${tableHtml({headers:['用例','预期','实际','状态','证据'],rows:list(integration.tests).map(item=>[item.id,item.expected,item.actual||'待执行',item.status||'PLANNED',list(item.evidence).map(valueText).join('；')])})}</div></div>`:''}</section><aside class="side"><div class="card"><div class="card-head"><h3>集成原则</h3></div><div class="card-body"><p>父候选变化先标记 STALE_PARENT；按项目已确认的评审和发布流程验证候选版本，记录自动部署联动，避免重复发布。</p></div></div></aside></div>`};
    const timelinePanel=()=>`<div class="card"><div class="card-head"><h2>审计时间线</h2><input id="event-filter" placeholder="筛选类型或内容"></div><div class="card-body" id="event-list"></div></div>`;
    const tabs=document.getElementById('tabs'),root=document.getElementById('interactive-root');
    const singleCompact=snapshot.render?.effective==='COMPACT'&&Object.keys(phases).length===1;
    let active=location.hash==='#overview'?'overview':location.hash==='#integration'?'integration':location.hash==='#timeline'?'timeline':location.hash.match(/^#phase-(P\d+)-/)?.[1]||snapshot.resume?.recommendedPhase||task.activePhase||Object.keys(phases)[0];
    const tabDefs=singleCompact?Object.values(phases).map(phase=>[phase.id,`${phase.id} · ${phase.name}`]):[['overview','总览'],...Object.values(phases).map(phase=>[phase.id,`${phase.id} · ${phase.name}`]),...(Object.keys(phases).length>1?[['integration','跨阶段集成']]:[]),['timeline','审计']];
    function renderTabs(){tabs.classList.toggle('hidden',tabDefs.length===1);tabs.innerHTML=tabDefs.map(([id,label])=>`<button class="tab" role="tab" data-view="${esc(id)}" aria-selected="${id===active}">${esc(label)}</button>`).join('')}
    function renderEventList(filter=''){const target=document.getElementById('event-list');if(!target)return;const term=filter.toLowerCase();target.innerHTML=events.filter(event=>!term||JSON.stringify(event).toLowerCase().includes(term)).slice().reverse().map(event=>`<div class="timeline-item"><b>${esc(event.type)}</b> ${esc(event.summary)}<small>${esc(event.at)} ${event.phaseId?`· ${esc(event.phaseId)}`:''}</small></div>`).join('')||'<p class="muted">没有匹配事件</p>'}
    function revealHashTarget(){const target=document.getElementById(location.hash.slice(1));if(!target)return;const group=target.closest('details.group');if(group)group.open=true;target.scrollIntoView({block:'start'});target.classList.add('focus-flash');setTimeout(()=>target.classList.remove('focus-flash'),1500)}
    function renderActive(){renderTabs();if(active==='overview')root.innerHTML=overviewPanel();else if(active==='integration')root.innerHTML=integrationPanel();else if(active==='timeline'){root.innerHTML=timelinePanel();renderEventList();document.getElementById('event-filter').addEventListener('input',event=>renderEventList(event.target.value))}else root.innerHTML=phasePanel(phases[active]||Object.values(phases)[0]);bindCommentTargets();if(location.hash)setTimeout(revealHashTarget,0)}
    tabs.addEventListener('click',event=>{const button=event.target.closest('[data-view]');if(!button)return;active=button.dataset.view;history.replaceState(null,'',active==='overview'?'#overview':active==='integration'?'#integration':active==='timeline'?'#timeline':`#phase-${active}-requirements`);renderActive()});
    document.getElementById('task-id').textContent=task.taskId;document.getElementById('task-title').textContent=task.title;document.getElementById('task-meta').textContent=`${snapshot.effectiveProfile} · ${snapshot.render?.effective||'COMPACT'} · v2.${task.version} · 更新 ${task.updatedAt}`;
    document.querySelector('.shell').classList.add(String(snapshot.render?.effective||'COMPACT').toLowerCase());
    const activePhase=phases[snapshot.resume?.recommendedPhase||task.activePhase]||Object.values(phases)[0],gateFailures=list(snapshot.resume?.gateFailures).flatMap(event=>list(event.errors).map(error=>`${event.phaseId||'ALL'} ${event.gate||'gate'}：${valueText(error)}`)),allBlockers=[...Object.values(snapshot.resume?.blockersByPhase||{}).flat().map(valueText),...gateFailures],candidate=activePhase?.branch?.candidateSha||activePhase?.branch?.headSha||'待确认';
    document.getElementById('status-grid').innerHTML=[['状态',task.state],['当前重点',`${snapshot.resume?.recommendedPhase||task.activePhase} · ${snapshot.resume?.firstBlockingGate||'完成'}`],['候选版本',candidate],['版本',`v2.${task.version}`]].map(([label,value])=>`<div class="metric"><small>${esc(label)}</small><strong>${esc(value)}</strong></div>`).join('');
    document.getElementById('blockers').innerHTML=allBlockers.length?`<div class="alert"><h2>阻塞或待确认</h2><ul>${allBlockers.map(value=>`<li>${esc(value)}</li>`).join('')}</ul></div>`:`<div class="alert ok next"><b>推荐下一步</b><span>${esc(snapshot.resume?.nextAction||activePhase?.nextAction||task.nextAction||'继续当前 Phase')}</span></div>`;
    document.getElementById('copy-task').addEventListener('click',()=>navigator.clipboard.writeText(task.taskId));document.getElementById('print-button').addEventListener('click',()=>window.print());

    const embeddedComments=JSON.parse(document.getElementById('ledger-comments-data').textContent);const storageKey=`lifecycle-comments:${task.taskId}`;let comments=embeddedComments;
    try{const local=JSON.parse(localStorage.getItem(storageKey)||'null');if(local?.taskId===task.taskId)comments={...comments,threads:mergeThreads(comments.threads||[],local.threads||[])}}catch(_error){}
    function mergeThreads(left,right){const map=new Map(left.map(thread=>[thread.id,thread]));right.forEach(thread=>{const current=map.get(thread.id);if(!current||String(thread.updatedAt)>=String(current.updatedAt))map.set(thread.id,thread)});return [...map.values()]}
    function persistComments(){comments.ledgerVersion=`v2.${task.version}`;localStorage.setItem(storageKey,JSON.stringify(comments));renderComments();syncCommentsToBridge()}
    async function syncCommentsToBridge(){const bridge=globalThis.__LEDGER_COMMENT_BRIDGE__;if(!bridge)return;try{await fetch(bridge.endpoint,{method:'PUT',headers:{'Content-Type':'application/json','X-Ledger-Comment-Token':bridge.token},body:JSON.stringify(comments)})}catch(_error){}}
    let commentTarget=null,selectedTarget=null;const composer=document.getElementById('comment-composer'),drawer=document.getElementById('comments-drawer'),selectionAction=document.getElementById('comment-selection-action');
    function bindCommentTargets(){document.querySelectorAll('[data-comment-target]').forEach(button=>button.addEventListener('click',()=>{commentTarget={sectionId:button.dataset.commentTarget,label:button.dataset.commentLabel};document.getElementById('comment-target-preview').textContent=commentTarget.label;document.getElementById('comment-textarea').value='';composer.classList.remove('hidden');document.getElementById('comment-textarea').focus()}))}
    function renderComments(){const mode=document.getElementById('comments-filter').value;const threads=list(comments.threads).filter(thread=>mode==='all'||(mode==='resolved'?thread.status==='resolved':thread.status!=='resolved'));document.getElementById('comments-count').textContent=list(comments.threads).filter(thread=>thread.status!=='resolved').length;document.getElementById('comments-list').innerHTML=threads.map(thread=>`<div class="thread"><div><span class="pill ${statusClass(thread.severity)}">${esc(thread.severity)}</span> <b>${esc(thread.target?.label||thread.target?.sectionId)}</b></div>${list(thread.messages).map(message=>`<p><b>${esc(message.author)}:</b> ${esc(message.body)}</p>`).join('')}<small class="muted">${esc(thread.updatedAt)}</small><div><button class="btn small" data-reply-thread="${esc(thread.id)}">追评</button> <button class="btn small" data-resolve-thread="${esc(thread.id)}">${thread.status==='resolved'?'重新打开':'解决'}</button></div></div>`).join('')||'<p class="muted">没有评论</p>';document.querySelectorAll('[data-reply-thread]').forEach(button=>button.addEventListener('click',()=>{const thread=comments.threads.find(item=>item.id===button.dataset.replyThread);commentTarget={sectionId:thread.target?.sectionId,label:thread.target?.label||thread.target?.sectionId,threadId:thread.id};document.getElementById('comment-target-preview').textContent=`追评：${commentTarget.label}`;document.getElementById('comment-textarea').value='';composer.classList.remove('hidden');document.getElementById('comment-textarea').focus()}));document.querySelectorAll('[data-resolve-thread]').forEach(button=>button.addEventListener('click',()=>{const thread=comments.threads.find(item=>item.id===button.dataset.resolveThread);thread.status=thread.status==='resolved'?'open':'resolved';thread.updatedAt=new Date().toISOString();persistComments()}))}
    document.getElementById('comments-button').addEventListener('click',()=>{drawer.classList.remove('hidden');renderComments()});document.getElementById('comments-close').addEventListener('click',()=>drawer.classList.add('hidden'));document.getElementById('comments-filter').addEventListener('change',renderComments);document.getElementById('comment-cancel').addEventListener('click',()=>composer.classList.add('hidden'));
    document.getElementById('comments-copy').addEventListener('click',()=>navigator.clipboard.writeText(JSON.stringify({...comments,threads:list(comments.threads).filter(thread=>thread.status!=='resolved')},null,2)));document.getElementById('comments-export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(comments,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`${task.taskId}-comments.json`;link.click();URL.revokeObjectURL(url)});
    document.addEventListener('mouseup',()=>{const selection=window.getSelection(),quote=selection?.toString().trim();if(!quote||quote.length>1200){selectionAction.classList.add('hidden');selectedTarget=null;return}const element=selection.anchorNode?.parentElement?.closest('[data-commentable]');if(!element?.id){selectionAction.classList.add('hidden');selectedTarget=null;return}selectedTarget={type:'text',sectionId:element.id,label:`选区：${quote.slice(0,60)}`,quote};selectionAction.classList.remove('hidden')});selectionAction.addEventListener('click',()=>{commentTarget=selectedTarget;document.getElementById('comment-target-preview').textContent=commentTarget.label;document.getElementById('comment-textarea').value='';composer.classList.remove('hidden');selectionAction.classList.add('hidden')});
    document.getElementById('comment-save').addEventListener('click',()=>{const body=document.getElementById('comment-textarea').value.trim();if(!body||!commentTarget)return;const stamp=new Date().toISOString();if(commentTarget.threadId){const thread=comments.threads.find(item=>item.id===commentTarget.threadId);thread.messages.push({id:`MSG-${crypto.randomUUID()}`,author:'user',createdAt:stamp,body});thread.status='open';thread.updatedAt=stamp}else{const id=`CMT-${crypto.randomUUID()}`;comments.threads.push({id,target:{type:commentTarget.type||'resource',sectionId:commentTarget.sectionId,resourceId:commentTarget.sectionId,resourceType:'section',label:commentTarget.label,quote:commentTarget.quote||''},severity:document.getElementById('comment-severity').value,status:'open',createdAt:stamp,updatedAt:stamp,messages:[{id:`MSG-${crypto.randomUUID()}`,author:'user',createdAt:stamp,body}],change:{status:'none',ledgerVersion:`v2.${task.version}`,summary:''}})}composer.classList.add('hidden');persistComments()});
    root.addEventListener('click',event=>{const link=event.target.closest('a[href^="#phase-"]');if(!link)return;if(link.getAttribute('href')===location.hash){event.preventDefault();revealHashTarget()}});
    window.addEventListener('hashchange',()=>{if(location.hash==='#overview')active='overview';else if(location.hash==='#integration')active='integration';else if(location.hash==='#timeline')active='timeline';else{const match=location.hash.match(/^#phase-(P\d+)-/);if(match&&phases[match[1]])active=match[1]}renderActive()});
    window.addEventListener('beforeprint',()=>{const printedEvents=`<div class="card"><div class="card-head"><h2>审计时间线</h2></div><div class="card-body">${events.map(event=>`<div class="timeline-item"><b>${esc(event.type)}</b> ${esc(event.summary)}<small>${esc(event.at)}</small></div>`).join('')}</div></div>`;const integration=Object.keys(phases).length>1?`<h1>跨阶段集成</h1>${integrationPanel()}`:'';const printRoot=document.getElementById('print-root');printRoot.innerHTML=`${overviewPanel()}${Object.values(phases).map(phase=>`<h1>${esc(phase.id)} · ${esc(phase.name)}</h1>${phasePanel(phase)}`).join('')}${integration}${printedEvents}`;printRoot.querySelectorAll('details.group').forEach(group=>group.open=true)});
    renderActive();renderComments();
  })();
  </script>
</body>
</html>
